<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoHLL ‒ Royal Hospitality Language Learning</title>
  
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --accent: #d97706;
      --accent-hover: #b45309;
      --soft-bg: #f8fafc;
      --border-color: #cbd5e0;
      --whale-bg: #f0f9ff;
      --whale-border: #bae6fd;
      --whale-text: #0369a1;
      --success-color: #15803d;
      --success-bg: #f0fdf4;
      --retry-color: #c2410c;
      --retry-bg: #fff7ed;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(30, 58, 138, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #e2e8f0;
    }
    header {
      background-color: var(--primary);
      color: #ffffff;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.05rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .progress-text {
      font-size: 0.85rem;
      opacity: 0.95;
      font-weight: 600;
      color: #fef3c7;
    }
    .progress-bar-container {
      height: 6px;
      background: #e2e8f0;
      width: 100%;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
    .content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .whale-comfort {
      background-color: var(--whale-bg);
      border: 1px solid var(--whale-border);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--whale-text);
      display: flex;
      gap: 10px;
      line-height: 1.5;
      align-items: flex-start;
    }
    .whale-icon {
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .course-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .course-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-btn {
      background-color: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
    }
    .lang-btn:hover {
      background-color: #f0f9ff;
      border-color: var(--primary);
      color: var(--primary);
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .action-btn {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      font-weight: 600;
    }
    .action-btn:hover {
      background-color: var(--soft-bg);
      border-color: var(--primary);
      color: var(--primary);
    }

    .dialogue-box {
      background: var(--soft-bg);
      border-left: 4px solid var(--primary);
      padding: 16px;
      border-radius: 0 10px 10px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .speaker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .speaker-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      font-weight: 700;
    }
    .button-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .speech-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--primary);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      font-weight: 600;
    }
    .speech-btn:hover {
      background: var(--primary);
      color: white;
    }
    .speech-btn.rec-btn {
      border-color: var(--accent);
      color: var(--accent);
    }
    .speech-btn.rec-btn.recording {
      background-color: #dc2626 !important;
      color: white !important;
      border-color: #dc2626 !important;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }
    }
    .japanese-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
      white-space: pre-line;
    }
    .translation-section {
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .translation-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .translation-text {
      font-size: 0.98rem;
      color: #1e3a8a;
      font-weight: 700;
      line-height: 1.5;
      white-space: pre-line;
    }
    .pinyin-text {
      font-size: 0.85rem;
      color: #475569;
      font-style: italic;
    }
    .kana-text {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 500;
    }
    .toggle-trans-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      align-self: flex-start;
      font-weight: 600;
    }

    .customer-section {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .customer-phrase {
      font-size: 0.95rem;
      color: #1e293b;
      font-weight: 600;
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid #cbd5e0;
      line-height: 1.4;
    }
    .recognition-result-box {
      margin-top: 6px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
      line-height: 1.5;
    }
    .recognition-result-box.success {
      background: var(--success-bg); border: 1px solid #bbf7d0; color: var(--success-color); display: block;
    }
    .recognition-result-box.retry {
      background: var(--retry-bg); border: 1px solid #fed7aa; color: var(--retry-color); display: block;
    }
    .recognition-note {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-style: italic;
    }
    .recognized-text-display {
      font-weight: 700;
      color: #1e3a8a;
      background: #ffffff;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #cbd5e0;
      display: inline-block;
      margin-top: 2px;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .nav-btn {
      background-color: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 600;
    }
    .nav-btn.primary {
      background-color: var(--primary);
      color: white;
      border: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .modal-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--primary);
    }
    .close-btn {
      background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-sub);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }
    .form-group input, .form-group textarea {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .submit-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container" id="app"></div>
<div id="modal-container"></div>

<script>
// フロント全35ステップデータ
const frontSteps = [
  { jp: "こんにちわ（こんばんわ）、いらっしゃいませ。", en: "Good afternoon (or Good evening), and welcome.", zh: "您好（晚上好），欢迎光临！", ko: "안녕하십니까(저녁에는 안녕하십니까), 어서 오십시오.", pinyin: "Nín hǎo (wǎnshang hǎo), huānyíng guānglín!", kana: "ニン ハオ（ワンシャン ハオ）、フアンイン グアンリン！", kanaKo: "アンニョンハシムニカ、オソ オシプシオ。", customerEn: "Hello. I have a reservation.", customerZh: "您好，我预订了房间。", customerKo: "안녕하세요. 예약했습니다.", feedback: "温かい笑顔でお迎えしましょう。" },
  { jp: "チェックインでしょうか？", en: "Are you checking in today?", zh: "您是办理入住吗？", ko: "체크인 하시겠습니까?", pinyin: "Nín shì bànlǐ rùzhù ma?", kana: "ニン シ バンリ ルージュ マ？", kanaKo: "チェクイン ハシゲッスムニカ？", customerEn: "Yes, that's right.", customerZh: "是的，没错。", customerKo: "네, 맞습니다.", feedback: "スムーズなご案内です。" },
  { jp: "どうぞ座ってください。", en: "Please have a seat.", zh: "请您这边坐，请坐。", ko: "이쪽으로 앉으십시오.", pinyin: "Qǐng nín zhèbiān zuò, qǐng zuò.", kana: "チン ニン ヂェビエン ズオ、チン ズオ。", kanaKo: "イッチョグロ アンジュシプシオ。", customerEn: "Thank you.", customerZh: "谢谢。", customerKo: "감사합니다.", feedback: "お気遣いの一言です。" },
  { jp: "お名前をどうぞ。", en: "May I have your name, please?", zh: "请问您贵姓？", ko: "성함이 어떻게 되십니까?", pinyin: "Qǐngwèn nín guìxìng?", kana: "チンウェン ニン グエイシン？", kanaKo: "ソンハミ オトケ テルシムニカ？", customerEn: "Sure, my name is John Smith.", customerZh: "好的，我叫约翰·史密斯。", customerKo: "네, 제 이름은 존 스미스입니다.", feedback: "正確なお名前確認の第一歩です。" },
  { jp: "少々お待ちください。", en: "One moment, please.", zh: "请您稍等一下。", ko: "잠시만 기다려 주십시오.", pinyin: "Qǐng nín shāo děng yīxià.", kana: "チン ニン シャオ ドン イーシア。", kanaKo: "チャムシマン キダリョ ジュシプシオ。", customerEn: "Take your time.", customerZh: "不着急，请慢用。", customerKo: "천천히 하세요.", feedback: "落ち着いたやり取りですね。" },
  { jp: "パスポートをよろしいでしょうか？\n（パスポートをお客様からお預かりします）", en: "May I have your passport, please?", zh: "请问我可以看一下您的护照吗？", ko: "여권을 보여주시겠습니까?", pinyin: "Qǐngwèn wǒ kěyǐ kàn yīxià nín de hùzhào ma?", kana: "チンウェン ウォ ケイイ カン イーシア ニン ダ フージャオ マ？", kanaKo: "ヨグォヌル ポヨジュシゲッスムニカ？", customerEn: "Here you are.", customerZh: "给您。", customerKo: "여기 있습니다.", feedback: "丁寧にお預かりしましょう。" },
  { jp: "◯◯さまですね、ありがとうございます。\nパスポートをコピーしてもよろしいでしょうか？", en: "Mr./Ms. Smith, thank you very much.\nMay I make a copy of your passport?", zh: "◯◯先生／女士，谢谢您。我可以复印一下您的护照吗？", ko: "◯◯님, 감사합니다. 여권을 복사해도 되겠습니까?", pinyin: "◯◯ xiānsheng/nǚshì, xièxie nín. Wǒ kěyǐ fùyìn yīxià nín de hùzhào ma?", kana: "◯◯ シェンション／ニューシ、シェシエ ニン。ウォ ケイイ フーイン イーシア ニン ダ フージャオ マ？", kanaKo: "◯◯ニム、カムサハムニダ。ヨグォヌル ボクサヘド テルゲッスムニカ？", customerEn: "Yes, of course.", customerZh: "好的，当然可以。", customerKo: "네, 물론입니다.", feedback: "安心していただける確認です。" },
  { jp: "少々お待ちください。", en: "Please give me just a moment.", zh: "请您稍等片刻。", ko: "잠시만 기다려 주십시오.", pinyin: "Qǐng nín shāo děng piànkè.", kana: "チン ニン シャオ ドン ピエンクァ。", kanaKo: "チャムシマン キダリョ ジュシプシオ。", customerEn: "Thank you.", customerZh: "谢谢。", customerKo: "감사합니다.", feedback: "丁寧な一言を忘れずに。" },
  { jp: "お待たせいたしました。\n◯◯さま、2名で1晩、お部屋タイプはスペリオアダブルでのご予約でお間違いはありませんか？", en: "Thank you for waiting.\nMr./Ms. Smith, you have a reservation for two guests for one night in a Superior Double room, is that correct?", zh: "让您久等了。◯◯先生／女士，您预订的是两位住一晚，房型是豪华大床房，请问没有弄错吧？", ko: "기다려 주셔서 감사합니다. ◯◯님, 성인 2명 1박, 객실 타입은 슈페리어 더블 예약 맞으십니까?", pinyin: "Ràng nín jiǔděng le...", kana: "ラン ニン ジョウドン ラ...", kanaKo: "キダリョ ジュシャソ カムサハムニダ。◯◯ニム、ソンイン トゥミョン イルバク、ケクシル タイプン シュペリオ ダブル イェヤク マジュシムニカ？", customerEn: "Yes, that's correct.", customerZh: "是的，没有错。", customerKo: "네, 맞습니다.", feedback: "予約内容の正確な確認です。" },
  { jp: "今回駐車場はご利用ですか？", en: "Will you be using our parking lot during your stay?", zh: "请问您这次需要使用停车场吗？", ko: "이번에 주차장을 이용하십니까?", pinyin: "Qǐngwèn nín zhècì xūyào shǐyòng tíngchēchǎng ma?", kana: "チンウェン ニン ヂェツー シューヤオ シーヨン ティンチャーチャン マ？", kanaKo: "イボネ ジュチャジャンウル イヨンハシムニカ？", customerEn: "Yes, we parked a car.", customerZh: "是的，我们停了一辆车。", customerKo: "네, 차를 주차했습니다.", feedback: "駐車場のご利用確認です。" },
  { jp: "どこに駐車しましたか？", en: "Could you tell me where you parked your car?", zh: "您的车停在哪里了呢？", ko: "어디에 주차하셨습니까?", pinyin: "Nín de chē tíng zài nǎlǐ le ne?", kana: "ニン ダ チェ ティン ザイ ナーリ ラ ヌァ？", kanaKo: "オディエ ジュチャハシャッスムニカ？", customerEn: "We parked in space number 15.", customerZh: "我们停在15号车位。", customerKo: "15번 자리에 주차했습니다.", feedback: "駐車位置をお伺いします。" },
  { jp: "それでは宿泊前精算となりますので駐車料金として1200円頂きます。", en: "As payment is requested in advance, the parking fee will be 1,200 yen, please.", zh: "因为是入住前结算，所以需要收取1200日元的停车费。", ko: "사전 정산이므로 주차 요금으로 1200엔을 받겠습니다.", pinyin: "Yīnwèi shì rùzhù qián jiésuàn...", kana: "インウェイ シ ルージュ チェン ジエスアン...", kanaKo: "サジョン ジョンサニムロ ジュチャ ヨグムロ チョンイベクエンウル パッケッスムニカ。", customerEn: "Here you are. By credit card, please.", customerZh: "给您。请刷信用卡。", customerKo: "여기 있습니다. 신용카드로 부탁드립니다.", feedback: "前精算のご案内です。" },

let currentScreen = 'start';
let currentCourse = 'front';
let currentLang = 'en';
let currentIndex = 0;
let showTranslationMap = {};

function playSpeech(text, langCode) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let cleanText = text.replace(/\\n/g, ' ').replace(/[（\(].*?[）\)]/g, '');
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = langCode;
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  if (window.speechSynthesis.getVoices().length === 0) {
    window.speechSynthesis.getVoices();
  }
  window.speechSynthesis.speak(utterance);
}

function testSpeechRecognition(expectedText, resultBoxId, btnId) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const resultBox = document.getElementById(resultBoxId);
  const btn = document.getElementById(btnId);

  if (!SpeechRecognition) {
    if (resultBox) {
      resultBox.className = 'recognition-result-box retry';
      resultBox.innerHTML = '🐳 くじらちゃん：お使いのブラウザは音声認識に対応していません。';
    }
    return;
  }

  const recognition = new SpeechRecognition();
  if (currentLang === 'zh') recognition.lang = 'zh-CN';
  else if (currentLang === 'ko') recognition.lang = 'ko-KR';
  else recognition.lang = 'en-US';

  if (btn) {
    btn.classList.add('recording');
    btn.textContent = '🎙️ 聴き取り中...';
  }

  recognition.onresult = function(event) {
    const speechResult = event.results[0][0].transcript;
    if (resultBox) {
      resultBox.className = 'recognition-result-box success';
      resultBox.innerHTML = `
        <strong>✨ 判定完了！</strong><br>
        認識された言葉: <span class="recognized-text-display">${speechResult}</span><br>
        🐳 くじらちゃん：素晴らしい発音です！自信が伝わってきますね。
        <div class="recognition-note">※音声判定はブラウザ機能を利用した目安です。</div>
      `;
    }
    resetButtonState(btn);
  };

  recognition.onerror = function() {
    if (resultBox) {
      resultBox.className = 'recognition-result-box retry';
      resultBox.innerHTML = '🐳 くじらちゃん：音声をうまく拾えませんでした。ゆっくりハッキリ話してみてくださいね。<div class="recognition-note">※音声判定はブラウザ機能を利用した目安です。</div>';
    }
    resetButtonState(btn);
  };

  recognition.onend = function() { resetButtonState(btn); };
  try { recognition.start(); } catch (e) { resetButtonState(btn); }
}

function resetButtonState(btn) {
  if (!btn) return;
  btn.classList.remove('recording');
  btn.innerHTML = btn.dataset.type === 'target' ? '🎙️ 発音をテストする' : '🎙️ 発音を返してみる';
}

function startSimulation(course, lang) {
  currentCourse = course;
  currentLang = lang;
  currentScreen = 'simulation';
  currentIndex = 0;
  showTranslationMap = {};
  renderApp();
}

        <div class="translation-section">

function toggleTranslation() {
  showTranslationMap[currentIndex] = !showTranslationMap[currentIndex];
  renderApp();
}

function nextStep() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  currentIndex++;
  renderApp();
}

function prevStep() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (currentIndex > 0) {
    currentIndex--;
    renderApp();
  } else {
    currentScreen = 'start';
    renderApp();
  }
}

function restartSimulation() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  currentScreen = 'start';
  currentIndex = 0;
  showTranslationMap = {};
  renderApp();
}
